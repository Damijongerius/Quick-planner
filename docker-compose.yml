services:
  app:
    build:
      context: ./services/app
      dockerfile: Dockerfile
    container_name: planner-app
    ports:
      - "3000:3000"
    env_file:
      - ./services/app/.env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/planner_db?schema=public
      - AUTH_URL=http://localhost:3000
      - AUTH_TRUST_HOST=true
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - WATCHPACK_POLLING=true
      # Local-only login without Google (only activates because AUTH_URL is localhost; see README).
      - AUTH_DEV_LOGIN=${AUTH_DEV_LOGIN:-true}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-dev-only-change-me}
    volumes:
      - ./services/app:/app
      - /app/node_modules
      - /app/.next
    command: ./dev.sh
    depends_on:
      - db
    restart: always

  mcp:
    build:
      context: .
      dockerfile: services/mcp/Dockerfile
    container_name: planner-mcp
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/planner_db?schema=public
      - PORT=3001
      # The app sends this as a bearer token; the MCP server refuses to start without it.
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-dev-only-change-me}
    volumes:
      - ./services/mcp/src:/app/services/mcp/src
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16-alpine
    container_name: planner-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=planner_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
