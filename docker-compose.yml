  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: planner-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/planner_db?schema=public
      - JWT_SECRET=9be36b2890786576f3f0e0c8b6a1d4f2a5e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5
      - PORT=3000
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
    depends_on:
      - db
    restart: always

  mcp:
    build:
      context: .
      dockerfile: services/mcp/Dockerfile
    container_name: planner-mcp
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/planner_db?schema=public
      - PORT=3001
    volumes:
      - ./services/mcp/src:/app/services/mcp/src
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16-alpine
    container_name: planner-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=planner_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
