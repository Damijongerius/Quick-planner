name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  app:
    name: App (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/app
    env:
      # Only used so Prisma's config can load; nothing connects to a database in CI.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/app/package-lock.json

      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run typecheck

      # Lint has a backlog of pre-existing findings; surface them without blocking merges.
      # Remove continue-on-error once `npm run lint` is clean.
      - run: npm run lint
        continue-on-error: true

      - run: npm test

  mcp:
    name: MCP server (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/mcp/package-lock.json

      - run: npm ci
      - run: mkdir -p prisma && cp ../app/prisma/schema.prisma prisma/ && npx prisma generate
      - run: npm run typecheck
